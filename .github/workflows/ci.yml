name: ci

on: [push, pull_request]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Без `with: { version: ... }` — action-setup@v4 падає з
      # "Multiple versions of pnpm specified", коли в package.json є packageManager.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Лінт кличеться напряму, а не через `turbo run lint`. Turbo, не знайшовши
      # задачі ні в одному пакеті, виходить з нулем — саме так цей крок і був
      # зеленим, не перевіряючи нічого. Biome ж читає репозиторій цілком, тож
      # новий пакет накривається тим самим викликом і пропустити його не можна.
      - run: pnpm lint
      - run: pnpm turbo run typecheck test build
